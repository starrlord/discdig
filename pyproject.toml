[project]
name = "discdig"
version = "1.2.2"
description = "Browse discmaster.textfiles.com and queue downloads, from your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=1.0",
    "httpx>=0.27",
]

[project.scripts]
discdig = "discdig.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["discdig"]

[tool.hatch.build]
include = ["discdig/**/*.py", "discdig/*.tcss"]
